name: Daily Profile Maintenance

on:
  schedule:
    # 13:00 India Standard Time (07:30 UTC).
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-profile-maintenance
  cancel-in-progress: false

jobs:
  update-activity-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record maintenance run
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" >> .github/activity_metrics.log

      - name: Commit maintenance log
        run: |
          git config user.name "Nachiketa Sharma"
          git config user.email "224293481+nachiketa11@users.noreply.github.com"
          git add .github/activity_metrics.log

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: record daily profile maintenance"
          git push
