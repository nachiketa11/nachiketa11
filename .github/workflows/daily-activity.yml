name: Daily Profile Maintenance

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity-log:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record maintenance run
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" >> .github/activity_metrics.log

      - name: Commit maintenance log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/activity_metrics.log
          git commit -m "chore: automated daily profile maintenance"
          git push
