<svg width="1200" height="46" viewBox="0 0 1200 46" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A2440" stop-opacity="0"/>
      <stop offset="18%" stop-color="#3D3560" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3D3560" stop-opacity="0.8"/>
      <stop offset="82%" stop-color="#3D3560" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2A2440" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="23" x2="1200" y2="23" stroke="url(#lineFade)" stroke-width="1"/>

  <!-- faint connecting threads between the three star nodes -->
  <g stroke="#5B3FA0" stroke-width="0.8" opacity="0.5">
    <line x1="540" y1="23" x2="600" y2="12"/>
    <line x1="600" y1="12" x2="660" y2="23"/>
  </g>

  <!-- three small star nodes -->
  <g fill="#A855F7">
    <circle cx="540" cy="23" r="2.6"/>
    <circle cx="600" cy="12" r="3.4"/>
    <circle cx="660" cy="23" r="2.6"/>
  </g>

  <!-- soft glow on the center node -->
  <circle cx="600" cy="12" r="7" fill="#C084FC" opacity="0.18"/>
</svg>
