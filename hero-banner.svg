<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#122436" stop-opacity="1"/>
      <stop offset="45%" stop-color="#0D1B28" stop-opacity="1"/>
      <stop offset="100%" stop-color="#081018" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="80%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#123B44" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0D1B28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shoot1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49E3E3" stop-opacity="0"/>
      <stop offset="100%" stop-color="#EAFBFB" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="shoot2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49E3E3" stop-opacity="0"/>
      <stop offset="100%" stop-color="#EAFBFB" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="barTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B2A34"/>
      <stop offset="100%" stop-color="#16232C"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- base background -->
  <rect width="1280" height="420" fill="#081018"/>
  <rect width="1280" height="420" fill="url(#bgGlow)"/>
  <rect width="1280" height="420" fill="url(#rightGlow)"/>

  <!-- faint vignette -->
  <rect width="1280" height="420" fill="black" opacity="0.12"/>
  <rect x="0" y="0" width="1280" height="60" fill="black" opacity="0.18"/>
  <rect x="0" y="360" width="1280" height="60" fill="black" opacity="0.18"/>

  <!-- faint texture lines -->
  <g stroke="#132430" stroke-width="1" opacity="0.35">
    <line x1="0" y1="90" x2="1280" y2="90"/>
    <line x1="0" y1="330" x2="1280" y2="330"/>
  </g>

  <!-- scattered stars, most static, a handful twinkling -->
  <g fill="#CFEFEF">
    <circle cx="52" cy="30" r="1.1" opacity="0.6"/>
    <circle cx="118" cy="62" r="0.8" opacity="0.4"/>
    <circle cx="210" cy="24" r="1.3" opacity="0.7">
      <animate attributeName="opacity" values="0.25;0.8;0.25" dur="3.6s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="48" r="0.9" opacity="0.5"/>
    <circle cx="430" cy="20" r="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.2s" begin="-2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="55" r="0.7" opacity="0.35"/>
    <circle cx="80" cy="120" r="0.9" opacity="0.4"/>
    <circle cx="170" cy="150" r="0.7" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="5s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="90" r="1.2" opacity="0.55"/>
    <circle cx="700" cy="40" r="0.9" opacity="0.5"/>
    <circle cx="760" cy="70" r="1.1" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="3.9s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="30" r="0.8" opacity="0.4"/>
    <circle cx="900" cy="55" r="1" opacity="0.55"/>
    <circle cx="960" cy="20" r="0.7" opacity="0.35">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.6s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="65" r="1.2" opacity="0.6"/>
    <circle cx="1100" cy="35" r="0.9" opacity="0.45"/>
    <circle cx="1160" cy="80" r="1" opacity="0.5">
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="3.3s" begin="-1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1220" cy="45" r="0.8" opacity="0.4"/>
    <circle cx="1240" cy="110" r="1.1" opacity="0.55"/>
    <circle cx="60" cy="340" r="0.8" opacity="0.3"/>
    <circle cx="140" cy="380" r="0.6" opacity="0.25"/>
    <circle cx="250" cy="360" r="0.9" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4.8s" begin="-2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="340" r="0.8" opacity="0.3"/>
    <circle cx="1080" cy="370" r="1" opacity="0.4"/>
    <circle cx="1200" cy="350" r="0.7" opacity="0.3"/>
  </g>

  <!-- shooting star 1: brief comet streak, mostly invisible, flashes across every ~9s -->
  <g opacity="0">
    <line x1="0" y1="0" x2="60" y2="30" stroke="url(#shoot1)" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="60" cy="30" r="1.8" fill="#EAFBFB"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.44;0.54;0.6;1" dur="9s" begin="-1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate"
      values="150,10; 150,10; 150,10; 260,75; 260,75; 260,75"
      keyTimes="0;0.38;0.44;0.54;0.6;1" dur="9s" begin="-1s" repeatCount="indefinite"/>
  </g>

  <!-- shooting star 2: slower, different path, offset timing -->
  <g opacity="0">
    <line x1="0" y1="0" x2="50" y2="26" stroke="url(#shoot2)" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="50" cy="26" r="1.4" fill="#EAFBFB"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.36;0.46;0.52;1" dur="13s" begin="-6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate"
      values="960,55; 960,55; 960,55; 1050,95; 1050,95; 1050,95"
      keyTimes="0;0.3;0.36;0.46;0.52;1" dur="13s" begin="-6s" repeatCount="indefinite"/>
  </g>

  <!-- ===================== LEFT SIDE ===================== -->

  <!-- small custom icon: minimal open hexagon node mark, gentle pulse -->
  <g transform="translate(64,52)" stroke="#49E3E3" stroke-width="1.3" fill="none" opacity="0.9">
    <polygon points="18,0 34,9 34,27 18,36 2,27 2,9"/>
    <circle cx="18" cy="18" r="3.2" fill="#49E3E3" stroke="none">
      <animate attributeName="r" values="2.6;3.6;2.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- large serif title -->
  <text x="64" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#EAF6F6" letter-spacing="1.5">NACHIKETA</text>
  <text x="64" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#EAF6F6" letter-spacing="1.5">SHARMA</text>

  <!-- subtitle -->
  <text x="66" y="236" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8FB6BC" letter-spacing="3">CREATIVE TECHNOLOGIST</text>

  <!-- focus line -->
  <text x="66" y="264" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#49E3E3" letter-spacing="2.2">AI &#183; SYSTEMS &#183; BUILDING BLOOM</text>

  <!-- thin divider -->
  <line x1="66" y1="284" x2="230" y2="284" stroke="#20353D" stroke-width="1"/>

  <!-- progress bars -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#7FA5AB" letter-spacing="1.5">
    <text x="66" y="310">BUILDER</text>
    <text x="66" y="336">EXPLORER</text>
    <text x="66" y="362">LEARNER</text>
  </g>
  <g stroke-linecap="round">
    <line x1="180" y1="306" x2="420" y2="306" stroke="url(#barTrack)" stroke-width="3"/>
    <line x1="180" y1="306" x2="360" y2="306" stroke="#49E3E3" stroke-width="3" opacity="0.9"/>

    <line x1="180" y1="332" x2="420" y2="332" stroke="url(#barTrack)" stroke-width="3"/>
    <line x1="180" y1="332" x2="330" y2="332" stroke="#49E3E3" stroke-width="3" opacity="0.75"/>

    <line x1="180" y1="358" x2="420" y2="358" stroke="url(#barTrack)" stroke-width="3"/>
    <line x1="180" y1="358" x2="392" y2="358" stroke="#49E3E3" stroke-width="3" opacity="0.95"/>
  </g>

  <!-- poetic line -->
  <text x="64" y="400" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14.5" fill="#5F868C">Curiosity becomes systems. Systems become products.</text>

  <!-- ===================== RIGHT SIDE : TECH CONSTELLATION ===================== -->
  <g transform="translate(700,60)" opacity="0.95">
    <!-- connecting lines -->
    <g stroke="#2A4F55" stroke-width="1">
      <line x1="30" y1="40" x2="120" y2="20"/>
      <line x1="120" y1="20" x2="210" y2="55"/>
      <line x1="210" y1="55" x2="300" y2="30"/>
      <line x1="120" y1="20" x2="150" y2="110"/>
      <line x1="150" y1="110" x2="60" y2="140"/>
      <line x1="150" y1="110" x2="250" y2="150"/>
      <line x1="250" y1="150" x2="330" y2="110"/>
      <line x1="60" y1="140" x2="20" y2="210"/>
      <line x1="150" y1="110" x2="150" y2="200"/>
      <line x1="150" y1="200" x2="240" y2="230"/>
      <line x1="240" y1="230" x2="330" y2="200"/>
      <line x1="150" y1="200" x2="80" y2="250"/>
      <line x1="330" y1="110" x2="380" y2="60"/>
      <line x1="330" y1="200" x2="400" y2="230"/>
    </g>
    <!-- nodes, the two anchor nodes pulse gently -->
    <g fill="#49E3E3">
      <circle cx="30" cy="40" r="2.6"/>
      <circle cx="120" cy="20" r="3.2"/>
      <circle cx="210" cy="55" r="2.4"/>
      <circle cx="300" cy="30" r="2.8"/>
      <circle cx="150" cy="110" r="3.6">
        <animate attributeName="r" values="3.2;4.4;3.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="140" r="2.4"/>
      <circle cx="250" cy="150" r="2.8"/>
      <circle cx="330" cy="110" r="2.4"/>
      <circle cx="20" cy="210" r="2"/>
      <circle cx="150" cy="200" r="3">
        <animate attributeName="r" values="2.6;3.8;2.6" dur="4.5s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="240" cy="230" r="2.6"/>
      <circle cx="330" cy="200" r="2.4"/>
      <circle cx="80" cy="250" r="2"/>
      <circle cx="380" cy="60" r="2"/>
      <circle cx="400" cy="230" r="2"/>
    </g>
    <!-- soft glow halo on the two anchor nodes, breathing -->
    <circle cx="150" cy="110" r="16" fill="#49E3E3" opacity="0.10" filter="url(#softBlur)">
      <animate attributeName="opacity" values="0.06;0.16;0.06" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="200" r="14" fill="#49E3E3" opacity="0.08" filter="url(#softBlur)">
      <animate attributeName="opacity" values="0.05;0.13;0.05" dur="4.5s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- tiny BLOOM flower mark, lower right, slow rotation -->
  <g transform="translate(1180,362)" stroke="#49E3E3" stroke-width="1" fill="none" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="60s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="-9" rx="4" ry="9"/>
      <ellipse cx="0" cy="9" rx="4" ry="9"/>
      <ellipse cx="-9" cy="0" rx="9" ry="4"/>
      <ellipse cx="9" cy="0" rx="9" ry="4"/>
      <ellipse cx="-6.3" cy="-6.3" rx="4" ry="9" transform="rotate(45 -6.3 -6.3)"/>
      <ellipse cx="6.3" cy="6.3" rx="4" ry="9" transform="rotate(45 6.3 6.3)"/>
      <ellipse cx="-6.3" cy="6.3" rx="4" ry="9" transform="rotate(-45 -6.3 6.3)"/>
      <ellipse cx="6.3" cy="-6.3" rx="4" ry="9" transform="rotate(-45 6.3 -6.3)"/>
    </g>
    <circle cx="0" cy="0" r="2.4" fill="#49E3E3" stroke="none"/>
  </g>
</svg>
