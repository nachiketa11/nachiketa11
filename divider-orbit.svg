<svg width="1200" height="40" viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lineFade2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A2440" stop-opacity="0"/>
      <stop offset="22%" stop-color="#382F55" stop-opacity="0.75"/>
      <stop offset="78%" stop-color="#382F55" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2A2440" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#lineFade2)" stroke-width="1"/>

  <!-- orbit ring with a single orbiting point -->
  <g transform="translate(600,20)">
    <circle r="10" fill="none" stroke="#5B3FA0" stroke-width="0.8" opacity="0.6"/>
    <circle cx="0" cy="0" r="1.6" fill="#C084FC"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle cx="10" cy="0" r="2.4" fill="#A855F7"/>
    </g>
  </g>
</svg>
